[base]
package = ocean
env_name = puffer_poly_tm
policy_name = PolyTM
rnn_name = PolyTMLSTM

[vec]
num_envs = 16

[env]
num_envs = 256
log_interval = 1000
nen_halt_penalty = 0.05
correctness_reward = 10.0
incorrectness_penalty = 10.0

tape_size = 512
observation_window = 16
work_alphabet = 256
state_alphabet = 256
move_work =10
move_state = 10
max_a = 4
max_i = 50
max_u = 100


[train]
total_timesteps = 2_000_000_000
gamma = 0.98
learning_rate = 0.05
minibatch_size = 32768

[sweep]
method = Protein 
metric = perf
goal = maximize
downsample = 10

[sweep.train.total_timesteps]
distribution = uniform
min = 50_000_000
max = 2_000_000_000
mean = 1_000_000_000
scale = 0.5

[sweep.env.nen_halt_penalty]
distribution = uniform
min = 0.5
max = 5.0
mean = 2.75
scale = auto

[sweep.env.correctness_reward]
distribution = uniform
min = 1.0
max = 20.0
mean = 10.5
scale = auto

[sweep.env.incorrectness_penalty]
distribution = uniform
min = 1.0
max = 20.0
mean = 10.5
scale = auto

[sweep.env.observation_window]
distribution = uniform
min = 8
max = 32
mean = 16
scale = auto

[sweep.env.move_work]
distribution = uniform
min = 5
max = 20
mean = 12
scale = auto

[sweep.env.move_state]
distribution = uniform
min = 5
max = 20
mean = 12
scale = auto