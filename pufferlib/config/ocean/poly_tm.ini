[base]
package = ocean
env_name = puffer_poly_tm
policy_name = PolyTM
rnn_name = PolyTMLSTM

[vec]
num_envs = 16

[env]
num_envs = 1024
log_interval = 100
log_episodes = 10

work_tape_size = 100
state_tape_size = 100
result_tape_size = 15

work_observation_window = 10
state_observation_window = 10
result_observation_window = 1

tape_alphabet = 10
move_head = 10

num_work_heads=1
num_state_heads=1
num_result_heads=1

nen_halt_penalty = 0.01
correctness_reward = 40.0
incorrectness_penalty = 20.0

max_steps = 50
problem_size =2

max_a = 4
max_i = 50
max_u = 100


[train]
total_timesteps = 2_000_000_000
gamma = 0.999
adv_norm = true
gae_lambda = 0.95
learning_rate = 0.001
minibatch_size = 32768

[sweep]
metric = score
goal = maximize

[sweep.train.total_timesteps]
distribution = uniform
min = 50_000_000
max = 2_000_000_000
mean = 1_000_000_000
scale = 0.5

[sweep.env.work_tape_size]
distribution = uniform
min = 50
max = 150
mean = 100
scale = auto

[sweep.env.state_tape_size]
distribution = uniform
min = 50
max = 150
mean = 100
scale = auto

[sweep.env.result_tape_size]
distribution = uniform
min = 50
max = 150
mean = 100
scale = auto

[sweep.env.work_observation_window]
distribution = uniform
min = 10
max = 50
mean = 30
scale = auto

[sweep.env.state_observation_window]
distribution = uniform
min = 10
max = 50
mean = 30
scale = auto

[sweep.env.result_observation_window]
