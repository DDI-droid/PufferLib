[base]
package = ocean
env_name = puffer_poly_tm
policy_name = PolyTM
rnn_name = PolyTMLSTM

[vec]
num_envs = 16

[env]
tape_size = 15
problem_size = 4
max_steps = 43
num_envs = 1024
log_episodes = 30
log_interval = 100

[train]
adam_beta1 = 0.6991889042451376
adam_beta2 = 0.9968459294078819
adam_eps = 2.867951737080607e-7

bptt_horizon = 64
checkpoint_interval = 200
clip_coef = 0.04675587982158977
ent_coef = 0.029421123595985962
gae_lambda = 0.9298515992833183
gamma = 0.999
learning_rate = 0.03831943969808964

max_grad_norm = 1.924267982270226
max_minibatch_size = 32768
minibatch_size = 32768
prio_alpha = 0.8967194004562238
prio_beta0 = 0.5394172845661204
total_timesteps = 1262716120.395078

vf_clip_coef = 0.1
vf_coef = 1.3542915034708227
vtrace_c_clip = 0.26343176388780587
vtrace_rho_clip = 0.692687692067663

[sweep]
metric = score
goal = maximize

[sweep.train.total_timesteps]
distribution = uniform
min = 5e7
max = 9e8
mean = 5e8
scale = auto

[sweep.train.gamma]
distribution = uniform
min = 0.9
max = 0.999
mean = 0.97
scale = auto

[sweep.env.max_steps]
distribution = uniform
min = 50
max = 200
mean = 125
scale = auto