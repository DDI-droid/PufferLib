[base]
package = ocean
env_name = puffer_poly_tm
policy_name = PolyTM
rnn_name = PolyTMLSTM

[vec]
num_envs = 16

[env]
num_envs = 1024
log_interval = 100
log_episodes = 1
nen_halt_penalty = 0.01
correctness_reward = 20.0
incorrectness_penalty = 20.0

tape_size = 100
observation_window = 20
work_alphabet = 10
state_alphabet = 10
move_work = 10
move_state = 10
max_steps = 500
max_a = 4
max_i = 50
max_u = 100


[train]
total_timesteps = 2_000_000_000
gamma = 0.999
adv_norm = true
gae_lambda = 0.95
learning_rate = 0.001
minibatch_size = 32768

[sweep]
metric = score
goal = maximize

[sweep.train.total_timesteps]
distribution = uniform
min = 50_000_000
max = 2_000_000_000
mean = 1_000_000_000
scale = 0.5

[sweep.env.tape_size]
distribution = uniform
min = 50
max = 150
mean = 100
scale = auto

[sweep.env.max_steps]
distribution = uniform
min = 150
max = 500
mean = 300
scale = auto

[sweep.env.nen_halt_penalty]
distribution = uniform
min = 0.1
max = 5.0
mean = 2.75
scale = auto

[sweep.env.correctness_reward]
distribution = uniform
min = 10.0
max = 20.0
mean = 15.0
scale = auto

[sweep.env.incorrectness_penalty]
distribution = uniform
min = 10.0
max = 20.0
mean = 12.5
scale = auto

[sweep.env.observation_window]
distribution = uniform
min = 10
max = 50
mean = 30
scale = auto

[sweep.env.move_work]
distribution = uniform
min = 10
max = 50
mean = 30
scale = auto

[sweep.env.move_state]
distribution = uniform
min = 10
max = 50
mean = 30
scale = auto