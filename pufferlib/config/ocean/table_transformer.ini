[base]
package = ocean
env_name = puffer_table_transformer
policy_name = TableTransformer
rnn_name = TableTransformerLSTM

[vec]
num_envs = 6
num_workers = 6

[env]
num_envs = 768
img_height = 7015
img_width = 4962
n_cell_boxes = 46
r_text_const_1 = 1
r_cut_const_1 = 1
r_row_const_1 = 300
step_penalty = 0.01
d_position = 5
log_interval = 100
min_steps = 4
max_steps = 60
stable_r_coeff = 0.01
done_r_coeff = 10


[train]
total_timesteps = 150_000_000
gamma = 0.98
learning_rate = 0.05
minibatch_size = 4608
checkpoint_interval = 10

[sweep.env.min_steps]
distribution = uniform
min = 2
max = 10
mean = 6
scale = auto

[sweep.env.max_steps]
distribution = uniform
min = 20
max = 100
mean = 60
scale = auto

[sweep.env.stable_r_coeff]
distribution = uniform
min = 0.0
max = 0.1
mean = 0.05
scale = auto

[sweep.env.done_r_coeff]
distribution = uniform
min = 5.0
max = 20.0
mean = 10.0
scale = auto

[sweep.env.d_position]
distribution = uniform
min = 5.0
max = 35.0
mean = 20.0
scale = auto

[sweep.env.step_penalty]
distribution = uniform
min = 0.0
max = 0.1
mean = 0.05
scale = auto

[sweep.env.r_cut_const_1]
distribution = uniform
min = 0.0
max = 2.0
mean = 1.0
scale = auto

[sweep.env.r_row_const_1]
distribution = uniform
min = 250
max = 500
mean = 375
scale = auto

[sweep.env.r_text_const_1]
distribution = uniform
min = 3
max = 11
mean = 7
scale = auto


