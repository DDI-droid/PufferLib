[base]
package = ocean
env_name = puffer_table_transformer
policy_name = TableTransformer

[vec]
num_envs = 16
num_workers = 16

[env]
num_envs = 256
num_action_boxes = 125
img_channels = 3
img_height = 2600
img_width = 3300
iou_inside = 0.5
iou_cell = 0.5
iou_row = 0.5
iou_col = 0.5
r_text_const_1 = 0.5
r_cut_const_1 = 0.5
r_cell_const_1 = 0.5
r_row_const_1 = 0.5
r_col_const_1 = 0.5



[train]
total_timesteps = 150_000_000
gamma = 0.98
learning_rate = 0.05
minibatch_size = 4096

[sweep.env.iou_inside]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.iou_cell]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.iou_row]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.iou_col]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.r_text_const_1]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.r_cut_const_1]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.r_cell_const_1]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.r_row_const_1]
distribution = uniform
min = 0.0
max = 1.0
