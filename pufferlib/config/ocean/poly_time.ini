[base]
package = ocean
env_name = puffer_poly_time
policy_name = PolyTime
rnn_name = PolyTimeLSTM

[vec]
num_envs = 16
num_workers = 16

[env]
num_envs = 512
log_interval = 1
nen_halt_penalty = 1.0
correctness_reward = 10.0
incorrectness_penalty = 10.0
max_agents = 4
max_items = 50
tape_size = 100
max_utility = 100

[train]
total_timesteps = 150_000_000
gamma = 0.98
learning_rate = 0.05
minibatch_size = 8192

[sweep.train.total_timesteps]
distribution = uniform
min = 50_000_000
max = 200_000_000
mean = 100_000_000
scale = 0.5

[sweep.env.nen_halt_penalty]
distribution = uniform
min = 0.5
max = 5.0
mean = 2.75
scale = auto

[sweep.env.correctness_reward]
distribution = uniform
min = 1.0
max = 20.0
mean = 10.5
scale = auto

[sweep.env.incorrectness_penalty]
distribution = uniform
min = 1.0
max = 20.0
mean = 10.5
scale = auto
